name: Publish PyPI and MCP Registry
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build twine
      - run: ruff check . && pytest -q
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          package = tomllib.load(open('pyproject.toml', 'rb'))['project']
          server = json.load(open('server.json'))
          assert package['version'] == server['version'] == server['packages'][0]['version']
          if os.environ['RELEASE_TAG']:
              assert os.environ['RELEASE_TAG'] == 'v' + package['version']
          assert 'mcp-name: ' + server['name'] in open('README.md').read()
          PY
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
  publish-pypi:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capitol-ledger-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install official MCP publisher
        run: |
          curl --fail --location --retry 3 --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --retry 3 --output checksums.txt https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt
          mv mcp-publisher.tar.gz mcp-publisher_linux_amd64.tar.gz
          grep ' mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum --check
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC and publish
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
